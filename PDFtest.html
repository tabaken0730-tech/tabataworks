<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>本格デジタルノート</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            background-image: radial-gradient(#444 20%, transparent 20%), radial-gradient(#444 20%, transparent 20%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        .notebook-container {
            position: relative;
            width: 90vw;
            height: 85vh;
            max-width: 1200px;
            max-height: 800px;
            visibility: hidden;
        }

        .page {
            background-color: white;
            box-shadow: inset 5px 0 10px rgba(0,0,0,0.1);
        }

        #loading {
            position: absolute;
            color: white;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div id="loading">ノートを開いています...</div>
    <div id="notebook" class="notebook-container"></div>

    <!-- 外部通信は一切せず、ご自身のサーバーに保存したファイルを読み込みます -->
    <script src="./build/pdf.mjs" type="module"></script>
    <!-- 先ほどステップ1でダウンロードしてアップしたファイルのパスを指定します -->
    <script src="./page-flip.browser.js"></script>

    <script type="module">
        import * as pdfjsLib from './build/pdf.mjs';
        pdfjsLib.GlobalWorkerOptions.workerSrc = './build/pdf.worker.mjs';

        // 表示したいPDFのパス（HTMLと同じ階層にある場合）
        const pdfUrl = 'th69_pro.pdf'; 

        let bookWidth = 500;
        let bookHeight = 700;

        async function initNotebook() {
            try {
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                const notebookElement = document.getElementById('notebook');
                
                const firstPage = await pdf.getPage(1);
                const viewport = firstPage.getViewport({ scale: 1.0 });
                const ratio = viewport.height / viewport.width;
                
                bookWidth = Math.min(500, window.innerWidth / 2 - 40);
                bookHeight = bookWidth * ratio;

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const scale = 2.0; 
                    const vp = page.getViewport({ scale: scale });
                    canvas.width = vp.width;
                    canvas.height = vp.height;
                    
                    canvas.style.width = '100%';
                    canvas.style.height = '100%';
                    
                    pageDiv.appendChild(canvas);
                    notebookElement.appendChild(pageDiv);

                    await page.render({ canvasContext: ctx, viewport: vp }).promise;
                }

                document.getElementById('loading').style.display = 'none';
                notebookElement.style.visibility = 'visible';

                // めくりライブラリの起動
                const pageFlip = new St.PageFlip(notebookElement, {
                    width: bookWidth,
                    height: bookHeight,
                    size: "fixed",
                    minWidth: bookWidth,
                    maxWidth: bookWidth * 2,
                    minHeight: bookHeight,
                    maxHeight: bookHeight,
                    drawShadow: true,
                    usePortrait: false,
                    startPage: 0
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            } catch (error) {
                console.error('エラーが発生しました:', error);
                document.getElementById('loading').textContent = 'ノートの読み込みに失敗しました。';
            }
        }

        initNotebook();
    </script>
</body>
</html>
